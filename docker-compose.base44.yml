services:
  web:
    image: nginx:alpine
    restart: on-failure
    command: ["sh", "-c", "sed -i 's/^user  nginx;/user  root;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/index.html | grep -q SpaceBot"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
